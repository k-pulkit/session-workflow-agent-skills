<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>session_ui</title>
<style>
:root {
  /* light = "night light": warm paper, no bright white, low blue, softer contrast */
  --bg: #e9dfcc; --panel: #f0e6d3; --panel2: #e6dbc5; --nav: #e2d6bf; --ink: #2f2719; --ink2: #4b4130; --muted: #8b7e66; --line: #d4c6aa;
  --accent: #a83a6a; --accent2: #2b6670; --ok: #4b7a2a; --warn: #9a6410; --bad: #a9402f;
  --strong: #6b3477; --icode: #e5d6bd; --icode-ink: #8a3557; --mark: #e8bf55; --mark-ink: #2f2719;
  --chip: #e2d3b8; --callout: #e5d9c0; --callout-line: #8a6d3b; --warnbg: #eedcb8; --infobg: #dde0c8;
  --learn: #dbe0c0; --learn-ink: #43661f; --ship: #d6dcd3; --ship-ink: #2b5763;
  --quick: #e9d8b0; --quick-ink: #765510; --spike: #e9cfc8; --spike-ink: #8a2f47;
  --k-concept: #2b6670; --k-intuition: #a26a12; --k-deep: #4b7a2a; --k-quiz: #a83a6a; --k-risk: #a9402f; --k-none: #6b4a8a;
  --ref: #2b5763; --refbg: #ded8c2; --date: #86775a; --codebg: #2b2520; --codefg: #eadfca;
  --glow: 0 0 0; --grid: rgba(120, 90, 40, .05); --scan: transparent;
  --fs: 17px; --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07080d; --panel: #0e1018; --panel2: #121522; --nav: #090a11; --ink: #e8f1ff; --ink2: #b3bfd6; --muted: #66708a; --line: #1d2236;
    --accent: #ff2bd6; --accent2: #00f0ff; --ok: #39ff88; --warn: #ffc400; --bad: #ff3b6b;
    --strong: #7df9ff; --icode: #1b1230; --icode-ink: #ff8ae6; --mark: #ffc400; --mark-ink: #07080d;
    --chip: #1a1430; --callout: #0f1730; --callout-line: #00f0ff; --warnbg: #221a06; --infobg: #07211f;
    --learn: #0b2a19; --learn-ink: #39ff88; --ship: #0b1d33; --ship-ink: #4fd8ff;
    --quick: #2a2208; --quick-ink: #ffd34d; --spike: #2c0b24; --spike-ink: #ff6bd9;
    --k-concept: #00f0ff; --k-intuition: #ffc400; --k-deep: #39ff88; --k-quiz: #ff2bd6; --k-risk: #ff3b6b; --k-none: #a46bff;
    --ref: #7df9ff; --refbg: #0b2233; --date: #8d97b5; --codebg: #05060a; --codefg: #e2e8f5;
    --glow: 0 0 12px; --grid: rgba(0, 240, 255, .035); --scan: rgba(255, 255, 255, .018); } }
:root[data-theme="dark"] { --bg: #07080d; --panel: #0e1018; --panel2: #121522; --nav: #090a11; --ink: #e8f1ff; --ink2: #b3bfd6; --muted: #66708a; --line: #1d2236;
    --accent: #ff2bd6; --accent2: #00f0ff; --ok: #39ff88; --warn: #ffc400; --bad: #ff3b6b;
    --strong: #7df9ff; --icode: #1b1230; --icode-ink: #ff8ae6; --mark: #ffc400; --mark-ink: #07080d;
    --chip: #1a1430; --callout: #0f1730; --callout-line: #00f0ff; --warnbg: #221a06; --infobg: #07211f;
    --learn: #0b2a19; --learn-ink: #39ff88; --ship: #0b1d33; --ship-ink: #4fd8ff;
    --quick: #2a2208; --quick-ink: #ffd34d; --spike: #2c0b24; --spike-ink: #ff6bd9;
    --k-concept: #00f0ff; --k-intuition: #ffc400; --k-deep: #39ff88; --k-quiz: #ff2bd6; --k-risk: #ff3b6b; --k-none: #a46bff;
    --ref: #7df9ff; --refbg: #0b2233; --date: #8d97b5; --codebg: #05060a; --codefg: #e2e8f5;
    --glow: 0 0 12px; --grid: rgba(0, 240, 255, .035); --scan: rgba(255, 255, 255, .018); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
::selection { background: var(--accent); color: #fff; }
body { margin: 0; color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 15px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px); }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
.wrap { display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }
nav { border-right: 1px solid var(--line); padding: 18px 14px; background: var(--nav);
  overflow-y: auto; max-height: 100vh; position: sticky; top: 0; font-family: var(--mono); }
nav::before { content: "> session_ui"; display: block; font: 700 13px var(--mono); color: var(--accent);
  text-shadow: var(--glow) color-mix(in srgb, var(--accent) 60%, transparent); margin: 0 0 14px 2px; letter-spacing: .04em; }
main { padding: 28px 40px 90px; width: 100%; min-width: 0; }
select { width: 100%; font: 600 13px var(--mono); padding: 9px 10px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--accent2) 45%, var(--line)); background: var(--panel); color: var(--ink); }
#sessinfo { margin: 8px 2px 4px; font: 11.5px var(--mono); color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  box-shadow: var(--glow) var(--accent2); }
.group { margin: 18px 0 6px; font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); }
.group::before { content: "// "; opacity: .6; }
.group.dim { color: var(--muted); }
/* sidebar sections: a summary line with a count, a fold arrow, and "+N more" past 5 items */
.navsec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
.navsec > summary::-webkit-details-marker { display: none; }
.navsec > summary::after { content: "▾"; margin-left: auto; font-size: 10px; opacity: .7; transition: transform .15s; }
.navsec:not([open]) > summary::after { transform: rotate(-90deg); }
.navsec > summary:hover { color: var(--accent2); }
.cnt { font: 700 9.5px var(--mono); padding: 0 6px; border-radius: 3px; letter-spacing: 0;
  background: color-mix(in srgb, currentColor 16%, transparent); }
.frow { position: relative; }
.frow.hidden { display: none; }
.frow .del { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); opacity: 0; pointer-events: none;
  padding: 1px 7px; font: 700 11px var(--mono); border-radius: 4px; background: transparent; color: var(--bad);
  border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); transition: opacity .12s; }
.frow:hover .del, .frow .del:focus { opacity: 1; pointer-events: auto; }
.frow:hover .flink { padding-right: 34px; }
.frow .del:hover { background: var(--bad); color: #fff; box-shadow: 0 0 10px -2px var(--bad); }
#confirm { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 100; width: min(520px, calc(100vw - 32px));
  padding: 16px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--bad);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 25%, transparent), 0 12px 40px rgba(0,0,0,.45), 0 0 22px -8px var(--bad); }
#confirm .cf-t { font: 700 14px var(--mono); color: var(--ink); margin-bottom: 6px; overflow-wrap: anywhere; }
#confirm .cf-s { font-size: 13px; color: var(--ink2); margin-bottom: 14px; }
#confirm .cf-b { display: flex; gap: 10px; justify-content: flex-end; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
button.danger:hover { box-shadow: 0 0 14px -2px var(--bad); }
.more { display: block; padding: 3px 9px 6px; font: 12px var(--mono); color: var(--accent2); }
.navsec.dim .more { color: var(--muted); }
.more:hover { color: var(--accent); text-decoration: none; }
.more.arch { color: var(--warn); }
.more.arch[data-armed] { color: var(--bad); font-weight: 700; }
/* sidebar scrollbar: thin, dark track, neon thumb */
nav { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, var(--line)) transparent; }
nav::-webkit-scrollbar { width: 8px; }
nav::-webkit-scrollbar-track { background: transparent; }
nav::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), var(--accent2)); border-radius: 8px;
  border: 2px solid var(--nav); opacity: .7; }
nav::-webkit-scrollbar-thumb:hover { box-shadow: 0 0 8px var(--accent); }
.flink { display: block; padding: 4px 9px; border-radius: 5px; font: 13px var(--mono); color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
.flink.dim { color: var(--muted); }
.helplink { color: var(--accent2); border: 1px dashed color-mix(in srgb, var(--accent2) 45%, transparent); margin-bottom: 4px; }
.flink:hover { background: color-mix(in srgb, var(--accent2) 8%, transparent); text-decoration: none; color: var(--ink); }
.flink.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); font-weight: 700;
  border-left-color: var(--accent); box-shadow: inset 8px 0 14px -10px var(--accent); }
.flink .due { color: var(--warn); }
.badge { display: inline-block; font: 700 10.5px var(--mono); padding: 0 7px; border-radius: 3px; background: var(--bad); color: #fff; margin-left: 6px; vertical-align: middle; }
.unrev-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.unrev-head h3 { margin: 0; }
.unrev-n { font: 700 15px var(--mono); color: var(--ink); }
.unrev-what { margin: 8px 0 16px; font-size: 15px; color: var(--ink2); }
.unrev-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; }
.unrev-sub { font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); margin-bottom: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 52px; gap: 10px; align-items: center; margin: 8px 0; font: 13px var(--mono); }
.bar-l { color: var(--ink); overflow-wrap: anywhere; line-height: 1.35; }
.bar-t { height: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar-t > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bad), var(--accent)); box-shadow: var(--glow) var(--accent); }
.bar-n { text-align: right; color: var(--ink); font-weight: 700; }
.bar-head { display: flex; justify-content: space-between; margin: 14px 0 2px; padding-bottom: 3px; border-bottom: 1px solid var(--line);
  font: 700 12px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
.bar-row.test .bar-t > i { background: linear-gradient(90deg, var(--accent2), var(--k-concept)); box-shadow: var(--glow) var(--accent2); }
.ask { margin: 0 0 12px; }
.ask-l { font-size: 13.5px; color: var(--ink2); margin-bottom: 4px; }
.ask .cp { width: 100%; text-align: left; font: 600 13px var(--mono); padding: 7px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask .cp::before { content: "$ "; color: var(--accent); }
@media (max-width: 900px) { .unrev-grid { grid-template-columns: 1fr; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 18px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.card b { display: block; font: 700 28px var(--mono); letter-spacing: -.02em; }
.card b.err { color: var(--bad); text-shadow: var(--glow) color-mix(in srgb, var(--bad) 55%, transparent); }
.card b.ok { color: var(--ok); text-shadow: var(--glow) color-mix(in srgb, var(--ok) 45%, transparent); }
.card span { color: var(--muted); font: 12px var(--mono); }
.card b small.sub { font: 600 12px var(--mono); color: var(--muted); text-shadow: none; }
.card span b.inl { display: inline; font: 700 12px var(--mono); color: var(--ink); text-shadow: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; margin: 18px 0; }
.panel h3 { font-family: var(--mono); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent2); }
.chip { display: inline-block; font: 700 11px var(--mono); padding: 1px 8px; border-radius: 3px; background: var(--chip); color: var(--accent); margin-right: 6px; text-transform: uppercase; letter-spacing: .04em; }
.chip.code { background: var(--learn); color: var(--learn-ink); } .chip.design { background: var(--ship); color: var(--ship-ink); }
.chip.plan { background: var(--quick); color: var(--quick-ink); } .chip.bugfix { background: var(--spike); color: var(--spike-ink); }
.ts { color: var(--muted); font: 12px var(--mono); margin-right: 8px; }
.ty { display: inline-block; font: 700 10.5px/1.7 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 0 7px; border-radius: 3px; vertical-align: 1px; }
.ty-build-hole { background: var(--learn); color: var(--learn-ink); } .ty-build { background: var(--ship); color: var(--ship-ink); }
.ty-quick { background: var(--quick); color: var(--quick-ink); } .ty-spike { background: var(--spike); color: var(--spike-ink); }

/* prose color cues */
.ref { color: var(--ref); background: var(--refbg); padding: 0 .4em; border-radius: 3px; font: 600 .88em var(--mono); white-space: nowrap; }
.dref { color: var(--accent2); font: 700 .88em var(--mono); }
.date { color: var(--date); font: .9em var(--mono); white-space: nowrap; }
.loud { color: var(--bad); font-weight: 800; letter-spacing: .03em; }
.arrow { color: var(--accent); font-weight: 700; }

/* reading layout */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; }
.reader.notoc { grid-template-columns: minmax(0, 1fr); }
.toc { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto;
  font: 12.5px var(--mono); border-left: 1px solid var(--line); padding-left: 14px; }
.toc a { display: block; color: var(--muted); padding: 3px 0; line-height: 1.4; overflow-wrap: anywhere; }
.toc { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, var(--line)) transparent; }
.toc a.h3 { padding-left: 12px; font-size: 12px; }
.toc a:hover { color: var(--accent2); text-decoration: none; }
.toc .tt { font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); margin-bottom: 8px; }
.toc .tt::before { content: "// "; opacity: .6; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-family: var(--mono); }
.tools button { padding: 3px 10px; font-size: 12px; }

.doc { font-size: var(--fs); line-height: 1.75; color: var(--ink); }
.doc > *:first-child { margin-top: 0; }
.doc p, .doc li { color: var(--ink2); }
.doc p { margin: 0 0 1em; }
.doc strong { color: var(--strong); font-weight: 700; }
.doc em { color: var(--ink); }
.doc h1 { font: 800 2em/1.15 var(--mono); margin: 0 0 .6em; letter-spacing: -.02em; color: var(--ink);
  text-shadow: 0 0 18px color-mix(in srgb, var(--accent2) 35%, transparent); }
.doc h1::after { content: "_"; color: var(--accent); margin-left: .15em; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.sec { --k: var(--k-none); }
.sec[data-kind="concept"] { --k: var(--k-concept); } .sec[data-kind="intuition"] { --k: var(--k-intuition); }
.sec[data-kind="deep"] { --k: var(--k-deep); } .sec[data-kind="quiz"] { --k: var(--k-quiz); } .sec[data-kind="risk"] { --k: var(--k-risk); }
.doc h2 { font: 700 1.2em/1.3 var(--mono); letter-spacing: .02em; margin: 2.2em 0 .8em; padding: 8px 12px 8px 14px; cursor: pointer; color: var(--ink);
  border-left: 3px solid var(--k); border-radius: 0 6px 6px 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--k) 14%, transparent), transparent 70%);
  box-shadow: -6px 0 16px -10px var(--k); }
.doc h2::before { content: "▾"; display: inline-block; width: 1.1em; color: var(--k); font-size: .8em; transition: transform .15s; }
.sec.collapsed > h2::before { transform: rotate(-90deg); }
.sec.collapsed > .sec-body { display: none; }
.sec.collapsed > h2 { opacity: .75; }
.doc h3 { font: 700 1.02em var(--mono); margin: 1.7em 0 .5em; color: var(--k, var(--ink)); }
.doc h3::before { content: "## "; opacity: .45; }
.doc h4 { margin: 1.4em 0 .4em; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font: 700 .78em var(--mono); }
.doc ul, .doc ol { padding-left: 1.4em; margin: 0 0 1em; }
.doc li { margin: .3em 0; }
.doc li::marker { color: var(--k, var(--accent)); }
.doc ol > li::marker { font: 700 .9em var(--mono); }
.doc li > ul, .doc li > ol { margin: .2em 0 .4em; }
.doc li:has(> .cb.done) { color: var(--muted); }
.doc li:has(> .cb.done) .ref { opacity: .6; }
.cb { display: inline-block; width: 1.3em; color: var(--muted); font-family: var(--mono); }
.cb.done { color: var(--ok); font-weight: 700; }
.doc .label { font: 700 .78em var(--mono); color: var(--k, var(--accent)); margin: 1.6em 0 .3em; text-transform: uppercase; letter-spacing: .12em; }
.doc .label::before { content: "> "; }
.doc .callout { background: var(--callout); border-left: 3px solid var(--callout-line); padding: 11px 15px; border-radius: 0 6px 6px 0; }
.doc .callout.cv-warn { background: var(--warnbg); border-left-color: var(--warn); }
.doc .callout.cv-info { background: var(--infobg); border-left-color: var(--ok); }
.doc blockquote { margin: 0 0 1em; background: var(--callout); border-left: 3px solid var(--callout-line); padding: 11px 15px; border-radius: 0 6px 6px 0; }
.doc blockquote p:last-child { margin-bottom: 0; }
.doc pre { position: relative; background: var(--codebg); color: var(--codefg); padding: 18px 18px 16px; border-radius: 8px;
  overflow-x: auto; font: 13.5px/1.55 var(--mono); margin: 0 0 1.3em;
  border: 1px solid color-mix(in srgb, var(--accent2) 30%, transparent); box-shadow: 0 0 22px -12px var(--accent2); }
.doc pre[data-lang]::before { content: attr(data-lang); position: absolute; top: 4px; right: 58px; font: 700 10px var(--mono);
  letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.doc pre .copy { position: absolute; top: 4px; right: 6px; padding: 0 8px; font-size: 11px; opacity: 0; color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 50%, transparent); }
.doc pre:hover .copy { opacity: 1; }
.doc code { font-family: var(--mono); background: var(--icode); padding: .12em .4em; border-radius: 4px; font-size: .84em; color: var(--icode-ink); }
.doc pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.doc a code { color: var(--accent2); background: color-mix(in srgb, var(--accent2) 12%, transparent); }
.tk-kw { color: #ff5fd2; } .tk-s { color: #a6ff5c; } .tk-n { color: #ffb347; } .tk-c { color: #5d6785; font-style: italic; }
.tk-f { color: #4fd8ff; } .tk-t { color: #ffe066; } .tk-k { color: #7df9ff; } .dg { color: #6a5cff; }
.doc table { border-collapse: separate; border-spacing: 0; margin: 0 0 1.4em; display: block; overflow-x: auto;
  font-size: .9em; line-height: 1.55; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.doc th, .doc td { padding: 9px 13px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.doc th { background: color-mix(in srgb, var(--k, var(--accent)) 12%, var(--panel)); color: var(--ink); font: 700 .82em var(--mono);
  text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.doc td:first-child { color: var(--ink); font-weight: 600; }
.doc tr:last-child td { border-bottom: 0; }
.doc tbody tr:hover td { background: color-mix(in srgb, var(--accent2) 6%, transparent); }
.doc hr { border: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent); margin: 2.4em 0; opacity: .6; }
.doc details.deep { border: 1px solid var(--line); border-left: 3px solid var(--k-deep); border-radius: 0 8px 8px 0; padding: 0 16px; margin: 0 0 12px; background: var(--panel); }
.doc details.deep > summary { cursor: pointer; padding: 10px 0; font-weight: 600; color: var(--ink); list-style: none; }
.doc details.deep > summary::-webkit-details-marker { display: none; }
.doc details.deep > summary::before { content: "▸ DEEP_DIVE  "; font: 700 10.5px var(--mono); letter-spacing: .1em; color: var(--k-deep); }
.doc details.deep[open] > summary::before { content: "▾ DEEP_DIVE  "; }

.ans { display: block; margin-top: 6px; padding: 4px 10px; border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); border-radius: 0 5px 5px 0; font-family: var(--mono); font-size: .9em; }

textarea, input[type=text] { width: 100%; font: 14px var(--mono); padding: 9px 11px; border-radius: 6px;

.quiz .q { margin: 16px 0; } .quiz .q p { margin: 0 0 6px; font-weight: 650; color: var(--ink); }

.lesson.shown .a { display: block; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.head .path { color: var(--muted); font: 600 12.5px var(--mono); }

table.mini td { padding: 3px 14px 3px 0; border-bottom: 1px solid var(--line); }
.mermaid-box { margin: 0 0 1.3em; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; text-align: center;
  box-shadow: 0 0 22px -14px var(--accent); }
.doc pre.mermaid { background: none; box-shadow: none; border: 0; padding: 0; margin: 0; color: var(--ink); font-size: 14px; }
.doc pre.mermaid-err { text-align: left; background: var(--codebg); color: var(--codefg); padding: 12px; }
@media (max-width: 1200px) { .reader { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 760px) {
  .wrap { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  :root { --fs: 16px; }
}
@media (prefers-reduced-motion: reduce) { .doc h1::after { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"><a class="flink helplink" href="#help">? help: skills, flow, words</a><div class="group">Session</div><select id="picker" aria-label="Session"></select><div id="sessinfo"></div><div id="files"></div><div class="group">Theme</div><button class="ghost" id="theme" style="width:100%">auto</button></nav>
  <main id="main"><p class="note">Pick a session.</p></main>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const CFG = { root: "", vscode: "", session: "" };
let SESSIONS = [];
let cur = { s: null, p: null, mtime: 0, summary: null };
const typed = {};  // unsaved input values, kept across re-renders: key -> text

async function api(url, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const r = await fetch(url, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const enc = encodeURIComponent;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const href = (s, p) => "#" + new URLSearchParams(p ? { s, p } : { s }).toString();

/* ---------- markdown (small subset: what the session files use) ---------- */

function slug(t) { return t.toLowerCase().replace(/[^\w]+/g, "-").replace(/^-|-$/g, ""); }

function resolveRel(base, rel) {
  const parts = base.split("/").slice(0, -1);
  for (const seg of rel.split("/")) {
    if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}

function fileLink(code, ctx) {
  // `path/to/file.py:42` or `file.py:42-60` -> open in VS Code at that line.
  const m = code.match(/^([\w.\/-]+\.[\w]+):(\d+)(?:-\d+)?$/);
  if (!m || !CFG.vscode) return null;
  const abs = m[1].startsWith("/") ? m[1] : [CFG.root, ctx.repo, m[1]].filter(Boolean).join("/");
  return `<a href="${esc(CFG.vscode + abs + ":" + m[2])}" title="open in VS Code"><code>${esc(code)}</code></a>`;
}

function inline(s, ctx) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    if (/^https?:/.test(u)) return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
    if (/\.md$/.test(u) && ctx.s) return `<a href="${esc(href(ctx.s, resolveRel(ctx.p || "", u)))}">${t}</a>`;
    return t;
  });
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, u) => `${pre}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/\[(DECIDE|YOU|ASSUME|VERIFY|OK)\]/g, '<span class="mk">$1</span>');
  s = s.replace(/\[(build\+hole|build|quick|spike)\]/g, (m, t) => `<span class="ty ty-${t.replace("+", "-")}">${t}</span>`);
  s = s.replace(/\[CHANGE:([^\]]*)\]/g, '<span class="mk">CHANGE:$1</span>');
  s = s.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, text) => tag || decorate(text));
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => fileLink(codes[i], ctx) || `<code>${esc(codes[i])}</code>`);
}

// Color cues in prose: step refs, decision ids, dates, arrows, hard rules. Runs on text between tags only.
function decorate(t) {
  return t
    .replace(/\b(Phase \d+\s*\/\s*Step \d+[a-z]?|P\d+\/S\d+|Phase \d+|Step \d+[a-z]?)\b/g, '<span class="ref">$1</span>')
    .replace(/\b(D\d{1,3}|G\d{1,3}|L-\d{3})\b/g, '<span class="dref">$1</span>')
    .replace(/\b(\d{4}-\d\d-\d\d)\b/g, '<span class="date">$1</span>')
    .replace(/\b(MUST NOT|MUST|NEVER|DO NOT|ALWAYS|ONLY)\b/g, '<span class="loud">$1</span>')
    .replace(/(→|-&gt;|=&gt;|←)/g, '<span class="arrow">$1</span>');
}

/* ---------- code highlighting (small tokenizer, common languages) ---------- */

const LANGS = { python: "py", py: "py", ts: "js", typescript: "js", js: "js", javascript: "js", json: "js", jsonata: "js",
  bash: "sh", sh: "sh", shell: "sh", zsh: "sh", console: "sh", sql: "sql", yaml: "yaml", yml: "yaml", toml: "yaml" };
const KW = {
  py: "def class return if elif else for while in not and or import from as with try except finally raise pass None True False lambda yield async await is self",
  js: "const let var function return if else for while of in new class extends import from export default async await try catch finally throw null undefined true false this typeof interface type readonly public private",
  sh: "if then else elif fi for do done case esac function export local return in while set",
  sql: "select from where join left right inner outer on group by order having insert into update delete create table as and or not null case when then else end with union all distinct limit merge partition over",
  yaml: "true false null yes no",
};
for (const k in KW) KW[k] = new Set(KW[k].split(" "));
const COM = { py: "#[^\\n]*", sh: "#[^\\n]*", yaml: "#[^\\n]*", js: "//[^\\n]*|/\\*[\\s\\S]*?\\*/", sql: "--[^\\n]*" };

function highlight(code, lang) {
  const L = LANGS[(lang || "").toLowerCase()];
  if (!L) return diagram(esc(code));
  const re = new RegExp(`(${COM[L] || "(?!)"})|("(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'|\`(?:\\\\.|[^\`\\\\])*\`)|(\\b\\d[\\w.]*)|([A-Za-z_$][\\w$-]*)`, "g");
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    if (!m[0]) { re.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    const nx = (code.slice(re.lastIndex).match(/^[ \t]*(.)/) || [])[1] || "";
    let cls = "";
    if (m[1]) cls = "c";
    else if (m[2]) cls = nx === ":" && L !== "py" ? "k" : "s";
    else if (m[3]) cls = "n";
    else if (m[4]) {
      const w = L === "sql" ? m[4].toLowerCase() : m[4];
      if (KW[L].has(w)) cls = "kw";
      else if (nx === ":" && (L === "yaml" || L === "js")) cls = "k";
      else if (nx === "(") cls = "f";
      else if (/^[A-Z][a-z]/.test(m[4]) && L !== "sql") cls = "t";
    }
    out += cls ? `<span class="tk-${cls}">${esc(m[0])}</span>` : esc(m[0]);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

// ASCII diagrams and plain text: dim the box lines and arrows so the labels stand out.
function diagram(h) {
  return h.replace(/(-{2,}&gt;|&lt;-{2,}|-+&gt;|[─│┌┐└┘├┤┬┴┼═║╔╗╚╝►▼▲◄]+|(?<=\s)[|v^](?=\s|$))/gm, '<span class="dg">$1</span>');
}

function liContent(t, ctx) {
  let m;
  if ((m = t.match(/^\[( |x|X)\]\s+(.*)$/s))) return (m[1] === " " ? '<span class="cb">☐</span>' : '<span class="cb done">✓</span>') + inline(m[2], ctx);
  if ((m = t.match(/^\[(\d{4}-\d\d-\d\d \d\d:\d\d)\] (\w+): (.*)$/s)))
    return `<span class="ts">${m[1]}</span><span class="chip ${m[2]}">${m[2]}</span>${inline(m[3], ctx)}`;
  return inline(t, ctx);
}

const LI = /^(\s*)([-*+]|(\d+)\.)\s+(.*)$/;
const BLOCK_START = /^\s*(```|~~~|#{1,6}\s|>|\|)/;

function md(src, ctx = {}) {
  const L = src.replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  if (!ctx.repo) { const r = src.match(/^Repo:\s*`?([\w.\/-]+)`?/m); if (r) ctx.repo = r[1]; }
  while (i < L.length) {
    const l = L[i], ln = i + 1;
    let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^\s*(```+|~~~+)\s*([\w+-]*)/))) {
      const fence = m[1], lang = m[2], buf = [];
      let j = i + 1;
      while (j < L.length && !L[j].trim().startsWith(fence)) buf.push(L[j++]);
      if (lang === "mermaid") out.push(`<div class="mermaid-box" data-line="${ln}"><pre class="mermaid">${esc(buf.join("\n"))}</pre></div>`);
      else out.push(`<pre data-line="${ln}"${lang ? ` data-lang="${esc(lang)}"` : ""}><code>${highlight(buf.join("\n"), lang)}</code></pre>`);
      i = j + 1; continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) {
      const n = m[1].length;
      out.push(`<h${n} data-line="${ln}" id="${slug(m[2])}">${inline(m[2], ctx)}</h${n}>`);
      i++; continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let h = `<table data-line="${ln}"><thead><tr>${cells(l).map(c => `<th>${inline(c, ctx)}</th>`).join("")}</tr></thead><tbody>`;
      let j = i + 2;
      while (j < L.length && /^\s*\|/.test(L[j])) {
        h += `<tr data-line="${j + 1}">${cells(L[j]).map(c => `<td>${inline(c, ctx)}</td>`).join("")}</tr>`; j++;
      }
      out.push(h + "</tbody></table>"); i = j; continue;
    }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote data-line="${ln}">${md(buf.join("\n"), ctx)}</blockquote>`); continue;
    }
    if (LI.test(l)) {
      const items = [];
      while (i < L.length) {
        const x = L[i];
        if ((m = x.match(LI))) { items.push({ indent: m[1].length, ordered: !!m[3], start: +m[3] || 1, text: m[4], line: i + 1 }); i++; continue; }
        if (!x.trim()) {
          let k = i + 1; while (k < L.length && !L[k].trim()) k++;
          if (k < L.length && (LI.test(L[k]) || /^\s{2,}\S/.test(L[k])) && !BLOCK_START.test(L[k].trim())) { i = k; continue; }
          break;
        }
        if (/^\s/.test(x) && !/^\s*(```|~~~)/.test(x) && items.length) { items[items.length - 1].text += "\n" + x.trim(); i++; continue; }
        break;
      }
      out.push(renderList(items, ctx)); continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !BLOCK_START.test(L[i]) && !LI.test(L[i])) buf.push(L[i++].trim());
    if (!buf.length) { buf.push(L[i++]); }
    const [body, answers] = splitAnswers(buf);
    // A paragraph that is only bold text reads as a small heading; "**Why:** ..." style lines read as callouts.
    const cls = /^\*\*[^*]+\*\*:?$/.test(body) ? ' class="label"'
      : /^\*\*(Risk|Warning|Important|Gotcha|Trap)/.test(body) ? ' class="callout cv-warn"'
      : /^\*\*(Why|Decision|Recommendation)/.test(body) ? ' class="callout cv-info"'
      : /^(\*\*(How to apply|Note|Rule|Status)[^*]*\*\*|Status:)/.test(body) ? ' class="callout"' : "";
    out.push(`<p data-line="${ln}"${cls}>${inline(body, ctx)}${answers.map(a => `<span class="ans">${inline(a, ctx)}</span>`).join("")}</p>`);
  }
  return out.join("\n");
}

// Draft answers ("A: ...") stay on their own line under the text they answer.
function splitAnswers(lines) {
  const body = [], answers = [];
  for (const l of lines) (/^\s*A:/.test(l) ? answers : body).push(l.trim());
  return [body.join(" "), answers];
}

function renderList(items, ctx) {
  let h = "";
  const stack = [];
  for (const it of items) {
    while (stack.length && it.indent < stack[stack.length - 1].indent) h += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length - 1];
    if (!top || it.indent > top.indent) {
      const tag = it.ordered ? "ol" : "ul";
      stack.push({ indent: it.indent, tag });
      h += `<${tag}${it.ordered && it.start !== 1 ? ` start="${it.start}"` : ""}>`;
    } else h += "</li>";
    const [body, answers] = splitAnswers(it.text.split("\n"));
    h += `<li data-line="${it.line}">${liContent(body, ctx)}${answers.map(a => `<div class="ans">${inline(a, ctx)}</div>`).join("")}`;
  }
  while (stack.length) h += `</li></${stack.pop().tag}>`;
  return h;
}

/* ---------- views ---------- */

async function loadSessions() {
  SESSIONS = await api("/api/sessions");
  const pick = $("#picker");
  pick.innerHTML = SESSIONS.map(x =>
    `<option value="${esc(x.name)}"${x.name === cur.s ? " selected" : ""}>${esc(x.name)}</option>`).join("")
    || `<option>No sessions found</option>`;
  pick.onchange = () => { location.hash = href(pick.value); };
  const x = SESSIONS.find(e => e.name === cur.s);
  $("#sessinfo").innerHTML = x ? `${x.plan.done}/${x.plan.total} steps
    <div class="bar"><i style="width:${x.plan.total ? 100 * x.plan.done / x.plan.total : 0}%"></i></div>` : "";
}

/* ---------- reading aids: sections, table of contents, deep dives, font size ---------- */

const folds = {};  // path -> {sectionId: collapsed?}, kept across auto-refresh
function setFont(delta) {
  let v = 17;
  try { v = +localStorage.getItem("sui-fs") || 17; } catch (e) {}
  v = Math.min(22, Math.max(14, v + delta));
  document.documentElement.style.setProperty("--fs", v + "px");
  try { localStorage.setItem("sui-fs", v); } catch (e) {}
}

function enhance(doc, p) {
  // Wrap each h2 and what follows it in a collapsible section.
  const kids = [...doc.childNodes];
  let sec = null;
  const sections = [];
  for (const n of kids) {
    if (n.nodeType === 1 && n.tagName === "H2") {
      sec = document.createElement("section");
      sec.className = "sec";
      sec.dataset.id = n.id;
      n.before(sec);
      sec.append(n);
      const body = document.createElement("div");
      body.className = "sec-body";
      sec.append(body);
      sections.push(sec);
    } else if (sec) sec.querySelector(".sec-body").append(n);
  }
  // Color each section by what it is for, so the reading order is visible at a glance.
  for (const x of sections) {
    const t = x.querySelector("h2").textContent.toLowerCase();
    x.dataset.kind = /concept|background|goal|context|overview/.test(t) ? "concept"
      : /intuition|idea|approach|architecture/.test(t) ? "intuition"
      : /deep dive|code|detail|walkthrough|signature|data flow|files/.test(t) ? "deep"
      : /quiz|try it|exercise|check/.test(t) ? "quiz"
      : /risk|non-goal|gotcha|footgun|trap|edge case|open/.test(t) ? "risk" : "";
  }
  // Archives (PlanDone.md, DesignDone.md) open folded except the newest entry.
  const f = folds[p] || (folds[p] = {});
  const archive = /Done\.md$/.test(p);
  sections.forEach((x, i) => {
    const id = x.dataset.id;
    if (!(id in f)) f[id] = archive && i < sections.length - 1;
    x.classList.toggle("collapsed", f[id]);
    x.querySelector("h2").onclick = () => { f[id] = !f[id]; x.classList.toggle("collapsed", f[id]); };
  });
  // Under a "Code" / "Deep dive" / "Walkthrough" section, each h3 becomes a closed deep dive:
  // concepts and intuition first, details on demand.
  for (const x of sections) {
    if (!/code|deep dive|walkthrough|details/i.test(x.querySelector("h2").textContent)) continue;
    const body = x.querySelector(".sec-body");
    let box = null;
    for (const n of [...body.childNodes]) {
      if (n.nodeType === 1 && n.tagName === "H3") {
        box = document.createElement("details");
        box.className = "deep";
        const sum = document.createElement("summary");
        n.before(box); sum.append(n); box.append(sum);
      } else if (box) box.append(n);
    }
  }
  renderMermaid(doc);
  // Copy button on code blocks.
  doc.querySelectorAll("pre:not(.mermaid)").forEach(pre => {
    const b = document.createElement("button");
    b.className = "ghost copy"; b.textContent = "copy";
    b.onclick = e => { e.stopPropagation(); navigator.clipboard.writeText(pre.querySelector("code").innerText); b.textContent = "copied"; };
    pre.append(b);
  });
  // Table of contents from h2/h3.
  const hs = [...doc.querySelectorAll("h2, h3")].filter(h => h.id);
  const toc = $("#toc");
  if (hs.length < 3) { toc.remove(); $(".reader").classList.add("notoc"); return; }
  toc.innerHTML = `<div class="tt">On this page</div>` + hs.map(h =>
    `<a class="${h.tagName.toLowerCase()}" href="javascript:void 0" data-id="${esc(h.id)}">${esc(h.textContent.replace(/^▾/, ""))}</a>`).join("");
  toc.querySelectorAll("a").forEach(a => a.onclick = () => {
    const h = document.getElementById(a.dataset.id);
    const s = h.closest(".sec");
    if (s && s.classList.contains("collapsed")) { f[s.dataset.id] = false; s.classList.remove("collapsed"); }
    const d = h.closest("details"); if (d) d.open = true;
    h.scrollIntoView({ block: "start" });
  });
}

function setTheme(t) {
  if (t === null) { try { t = localStorage.getItem("sui-theme") || "dark"; } catch (e) { t = "dark"; } }
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $("#theme").textContent = t;
  if (mermaidReady && cur.p) show(true);  // re-draw diagrams in the new theme
  try { localStorage.setItem("sui-theme", t); } catch (e) {}
}

// Mermaid diagrams: the library is served from /vendor and loaded only when a page has a diagram.
let mermaidReady = null;
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
}
async function renderMermaid(doc) {
  const nodes = [...doc.querySelectorAll("pre.mermaid")];
  if (!nodes.length) return;
  nodes.forEach(n => { n.dataset.src = n.textContent; });
  try {
    mermaidReady = mermaidReady || new Promise((ok, bad) => {
      const s = document.createElement("script");
      s.src = "/vendor/mermaid.min.js"; s.onload = ok; s.onerror = () => bad(new Error("mermaid.min.js not found in vendor/"));
      document.head.append(s);
    });
    await mermaidReady;
    const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base", flowchart: { curve: "basis" },
      fontFamily: "JetBrains Mono, Fira Code, ui-monospace, Menlo, Consolas, monospace",
      themeVariables: { darkMode: isDark(), background: v("--panel"), primaryColor: v("--panel2"), primaryTextColor: v("--ink"),
        primaryBorderColor: v("--accent2"), secondaryColor: v("--chip"), tertiaryColor: v("--panel"), lineColor: v("--accent"),
        textColor: v("--ink2"), noteBkgColor: v("--callout"), noteTextColor: v("--ink"), actorBorder: v("--accent2"),
        actorBkg: v("--panel2"), actorTextColor: v("--ink"), signalColor: v("--accent"), signalTextColor: v("--ink2") } });
    await window.mermaid.run({ nodes });
  } catch (e) {
    nodes.forEach(n => {
      if (n.querySelector("svg")) return;
      n.classList.add("mermaid-err");
      n.textContent = n.dataset.src;
      n.insertAdjacentHTML("beforebegin", `<p class="note err">Diagram did not render: ${esc(e.message || String(e))}</p>`);
    });
  }
}

function foldAll(p, collapsed) {
  const f = folds[p] || (folds[p] = {});
  document.querySelectorAll(".sec").forEach(x => { f[x.dataset.id] = collapsed; x.classList.toggle("collapsed", collapsed); });
  document.querySelectorAll("details.deep").forEach(d => { d.open = !collapsed; });
}

const navOpen = {}, navMore = {};  // sidebar section state, kept across re-renders

// In-page "are you sure" banner for a soft delete (the file moves to archive/<date>/deleted/).
function askDelete(p, sum) {
  const old = $("#confirm"); if (old) old.remove();
  const box = document.createElement("div");
  box.id = "confirm";
  box.innerHTML = `<div class="cf-t">Delete <code>${esc(p)}</code>?</div>
    <div class="cf-s">It moves to <code>archive/${new Date().toISOString().slice(0, 10)}/deleted/</code> and is listed in MANIFEST.md, so you can move it back.</div>
    <div class="cf-b"><button class="ghost" id="cf-no">Cancel</button><button class="danger" id="cf-yes">Delete</button></div>`;
  document.body.append(box);
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("#cf-no").onclick = close;
  $("#cf-yes").onclick = async () => {
    try {
      const r = await api("/api/trash", { s: cur.s, p });
      close();
      if (cur.p === p) location.hash = href(cur.s); else await show(true);
    } catch (err) { box.querySelector(".cf-s").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  };
  $("#cf-yes").focus();
}

function fileNav(sum) {
  const f = sum.files;
  const link = (p, label) => `<a class="flink${p === cur.p ? " active" : ""}" href="${esc(href(cur.s, p))}" title="${esc(p)}">${esc(label || p)}</a>`;
  // The workflow files first, in the order you use them; everything else below, grayed.
  const WORK = ["Plan.md", "Design.md", "Journal.md", "Lessons.md", "reference.md"];
  const dim = (p, label) => link(p, label).replace('class="flink', 'class="flink dim');
  let h = `<div class="group">Workflow</div><a class="flink${!cur.p ? " active" : ""}" href="${esc(href(cur.s))}">Overview</a>`;
  h += WORK.filter(n => f.core.includes(n)).map(n => n === "Lessons.md" && sum.lessons_due
    ? link(n, n).replace(`>${n}<`, `>${n} <span class="due">${sum.lessons_due} due</span><`) : link(n, n)).join("");
  // Learnings (explainers, lessons, guides) are what you read to keep the code in your head: shown like Workflow.
  // Sections below Workflow: foldable, with a count; past 5 items the rest hide behind "+N more".
  const section = (name, items, bright, max = 4) => {  // 4 visible, the rest behind "+N more"
    if (!items.length) return "";
    const open = navOpen[name] !== false, more = navMore[name] || items.some((x, i) => i >= max && x.p === cur.p);
    const OWNED = ["Plan.md", "PlanDone.md", "Design.md", "DesignDone.md", "Journal.md", "Lessons.md", "reference.md"];
    const canDel = x => (name === "Drafts" || name === "Other") && !OWNED.includes(x.p);
    const rows = items.map((x, i) => `<div class="frow${i >= max && !more ? " hidden" : ""}">${(bright ? link : dim)(x.p, x.label)}${canDel(x)
      ? `<button class="del" data-p="${esc(x.p)}" title="delete (moves to archive/)" aria-label="delete ${esc(x.p)}">✕</button>` : ""}</div>`);
    return `<details class="navsec${bright ? "" : " dim"}" data-sec="${name}"${open ? " open" : ""}>
      <summary class="group${bright ? "" : " dim"}">${name}<span class="cnt">${items.length}</span></summary>${rows.join("")}
      ${items.length > max ? `<a class="more" href="javascript:void 0" data-sec="${name}">${more ? "show less" : `+${items.length - max} more`}</a>` : ""}</details>`;
  };
  const strip = (pre, arr) => arr.map(e => ({ p: e.path, label: e.path.replace(pre, "") }));
  h += section("Learnings", strip(/^learnings\//, f.learnings), true, 4);
  const mt = f.core_mtime || {};
  const rest = f.core.filter(n => !WORK.includes(n)).sort((a, b) => (mt[b] || 0) - (mt[a] || 0)).map(n => ({ p: n, label: n }));  // newest first
  h += section("Other", rest, false, 4) + section("Drafts", strip(/^drafts\//, f.drafts), false, 4)
    .replace(/<\/details>$/, f.drafts.length > 10 ? `<a class="more arch" href="javascript:void 0">archive ${f.drafts.length - 10} oldest</a></details>` : "</details>")
    + section("Lenses", strip(/^lenses\//, f.lenses));
  $("#files").innerHTML = h;
  document.querySelectorAll("#files details.navsec").forEach(d => d.addEventListener("toggle", () => { navOpen[d.dataset.sec] = d.open; }));
  document.querySelectorAll("#files .del").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); askDelete(b.dataset.p, sum); });
  // Two clicks: the first arms the button, the second moves the files (no browser dialog).
  document.querySelectorAll("#files .arch").forEach(a => a.onclick = async e => {
    e.stopPropagation();
    if (!a.dataset.armed) { a.dataset.armed = "1"; a.textContent = "click again: move to archive/"; return; }
    try {
      const r = await api("/api/archive-drafts", { s: cur.s });
      a.textContent = `moved ${r.moved.length}` + (r.skipped.length ? `, kept ${r.skipped.length} in review` : "");
      setTimeout(() => show(true), 900);
    } catch (err) { a.textContent = "failed: " + err.message; }
  });
  document.querySelectorAll("#files .more:not(.arch)").forEach(a => a.onclick = () => { navMore[a.dataset.sec] = !navMore[a.dataset.sec]; fileNav(sum); });
}

function overview(sum) {
  const pl = sum.plan;
  const types = Object.entries(pl.types).map(([t, n]) => `<span class="chip">${t} ${n}</span>`).join("");
  const ctx = { s: cur.s, p: "Journal.md" };
  $("#main").innerHTML = `
    <div class="head"><h2 style="margin:0">${esc(sum.name)}</h2><span class="path">${pl.done}/${pl.total} steps done</span></div>
    <div class="bar" style="height:6px;margin-top:10px"><i style="width:${pl.total ? 100 * pl.done / pl.total : 0}%"></i></div>
    <p>${types}</p>
    ${pl.next ? `<p><b>Next open step:</b> ${inline(pl.next, ctx)}</p>` : ""}
    <div class="cards">
      <div class="card"><b>${sum.lessons_due}</b><span>lessons due${sum.lessons_due ? ` · <a href="${esc(href(cur.s, "Lessons.md"))}">practice</a>` : ""}</span></div>
    </div>
    <div class="panel"><h3 style="margin-top:0">Journal (last 10)</h3><ul>${sum.journal_tail.map(l => `<li>${liContent(l.replace(/^- /, ""), ctx)}</li>`).join("")}</ul></div>`;
}

function quizItems(text) {
  const L = text.split("\n");
  const start = L.findIndex(l => /^##\s+Quiz\b/i.test(l));
  if (start < 0) return null;
  const qs = [];
  for (let i = start + 1; i < L.length && !/^##\s/.test(L[i]); i++) {
    const m = L[i].match(/^\s*(\d+)\.\s+(.*)$/);
    if (m) qs.push(m[2]); else if (L[i].trim() && qs.length) qs[qs.length - 1] += " " + L[i].trim();
  }
  return qs;
}

function parseAnswers(text) {
  const out = [];
  for (const l of (text || "").split("\n")) {
    const m = l.match(/^(\d+)\.\s?(.*)$/);
    if (m) out[+m[1] - 1] = m[2]; else if (/^ {3}/.test(l) && out.length) out[out.length - 1] += "\n" + l.slice(3);
  }
  return out;
}

function attachQuiz(doc, res, ctx) {
  const qs = quizItems(res.text);
  if (!qs || !qs.length) return;
  const h2 = [...doc.querySelectorAll("h2")].find(h => /quiz/i.test(h.textContent));
  if (h2) { let n = h2.nextElementSibling; while (n && n.tagName !== "H2") { const nx = n.nextElementSibling; n.remove(); n = nx; } }
  const saved = parseAnswers(res.answers && res.answers.text);
  const form = document.createElement("div");
  form.className = "quiz panel";
  form.innerHTML = `<p class="note">Read the explainer and the raw diff first. Answer in your own words. No looking at the code while you answer.
    ${res.answers ? `<br><span class="ok">Saved answers on file.</span> Tell Claude "answered" to get them graded.` : ""}</p>` +
    qs.map((q, i) => {
      const key = `${cur.s}|${cur.p}|q${i}`;
      const val = typed[key] ?? saved[i] ?? "";
      return `<div class="q"><p>${i + 1}. ${inline(q, ctx)}</p><textarea data-key="${esc(key)}">${esc(val)}</textarea></div>`;
    }).join("") +
    `<div class="box"><button id="saveq">Save answers</button><button class="ghost" id="copyq">Copy for chat</button><span id="qmsg" class="note"></span></div>`;
  (h2 ? h2.after(form) : doc.append(form));
  const vals = () => [...form.querySelectorAll("textarea")].map(t => t.value);
  form.querySelector("#saveq").onclick = async () => {
    try {
      const r = await api("/api/answers", { s: cur.s, p: cur.p, answers: vals() });
      form.querySelectorAll("textarea").forEach(t => delete typed[t.dataset.key]);
      $("#qmsg").innerHTML = `<span class="ok">Saved to ${esc(r.saved)}. Tell Claude "answered".</span>`;
    } catch (e) { $("#qmsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  form.querySelector("#copyq").onclick = async () => {
    await navigator.clipboard.writeText(vals().map((v, i) => `${i + 1}. ${v}`).join("\n"));
    $("#qmsg").textContent = "Copied.";
  };
}

function attachMarkers(doc, res) {
  const L = res.text.split("\n");
  const blocks = [...doc.querySelectorAll("[data-line]")];
  // A real marker: after the first "##" heading (the header only explains markers) and not inside `code`.
  const firstH = L.findIndex(l => /^##\s/.test(l));
  const isMarker = (line, k) => k > firstH && /\[(DECIDE|YOU)\]/.test(line.replace(/`[^`]*`/g, ""));
  L.forEach((line, k) => {
    if (!isMarker(line, k)) return;
    // Answered = a non-empty "A:" line before the next marker or heading. An empty "A:" is a placeholder.
    let j = k + 1, answered = false;
    while (j < L.length && !/^\s*#/.test(L[j]) && !/\[(DECIDE|YOU|ASSUME|VERIFY)\]/.test(L[j])) {
      const a = L[j].match(/^\s*A:(.*)$/);
      if (a) { answered = !!a[1].trim(); break; }
      if (!L[j].trim() && !(L[j + 1] || "").match(/^[ \t]/)) break;
      j++;
    }
    if (answered) return;
    let el = null;
    for (const b of blocks) if (+b.dataset.line <= k + 1) el = b;
    if (!el) return;
    const key = `${cur.s}|${cur.p}|m${k}`;
    const box = document.createElement("div");
    box.className = "box";
    box.innerHTML = `<input type="text" data-key="${esc(key)}" placeholder="A: your answer (ok accepts the agent's pick)" value="${esc(typed[key] || "")}"><button>Answer</button>`;
    box.querySelector("button").onclick = async () => {
      const v = box.querySelector("input").value.trim();
      if (!v) return;
      try { await api("/api/marker", { s: cur.s, p: cur.p, line: k + 1, orig: line, answer: v }); delete typed[key]; await show(true); }
      catch (e) { alert(e.message); }
    };
    if (/^(LI|P)$/.test(el.tagName)) el.append(box); else el.after(box);
  });
  const open = L.filter(isMarker).length;
  const note = document.createElement("p");
  note.className = "note";
  note.textContent = `Answers are written into the draft as "A:" lines. When done, tell Claude "reviewed". ${open} marker line(s) in this file.`;
  doc.prepend(note);
}

function attachLessons(doc, sum) {
  const items = sum.lessons;
  if (!items.length) return;
  const due = items.filter(x => x.due);
  const box = document.createElement("div");
  box.className = "panel";
  const render = list => list.map((x, i) => `<div class="lesson" data-i="${i}"><div class="note">${esc(x.head)} · next ${esc(x.next)} · streak ${esc(x.streak)}</div>
      <p><b>${inline(x.q, {})}</b></p><textarea placeholder="Your answer first"></textarea>
      <div class="box"><button class="ghost reveal">Reveal</button></div><div class="a">${inline(x.a, {})}</div></div>`).join("");
  box.innerHTML = `<h3 style="margin-top:0">Practice</h3><p class="note">Self-check only. The review schedule changes only through Claude ("drill me").</p>
    <p><button class="ghost" id="ldue">Due (${due.length})</button> <button class="ghost" id="lall">All (${items.length})</button></p><div id="llist"></div>`;
  doc.prepend(box);
  const show = list => {
    box.querySelector("#llist").innerHTML = render(list) || `<p class="note">Nothing due.</p>`;
    box.querySelectorAll(".reveal").forEach(b => b.onclick = () => b.closest(".lesson").classList.add("shown"));
  };
  box.querySelector("#ldue").onclick = () => show(due);
  box.querySelector("#lall").onclick = () => show(items);
  show(due);
}

async function showHelp(force) {
  const y = force ? window.scrollY : 0;
  const res = await api("/api/help");
  document.querySelectorAll(".helplink").forEach(a => a.classList.add("active"));
  $("#main").innerHTML = `<div class="head"><span class="path">help</span><span class="tools">
      <button class="ghost" id="fold1">Collapse all</button><button class="ghost" id="fold0">Expand all</button>
      <button class="ghost" id="fsm">A−</button><button class="ghost" id="fsp">A+</button></span></div>
    <div class="reader"><article class="doc" id="doc">${md(res.text, { s: cur.s, p: "help" })}</article><aside class="toc" id="toc"></aside></div>`;
  enhance($("#doc"), "help");
  $("#fold1").onclick = () => foldAll("help", true);
  $("#fold0").onclick = () => foldAll("help", false);
  $("#fsm").onclick = () => setFont(-1);
  $("#fsp").onclick = () => setFont(1);
  if (force) window.scrollTo(0, y);
}

async function show(force) {
  if (location.hash === "#help") { await loadSessions(); if (cur.summary) fileNav(cur.summary); return showHelp(force); }
  document.querySelectorAll(".helplink").forEach(a => a.classList.remove("active"));
  const q = new URLSearchParams(location.hash.slice(1));
  const s = q.get("s"), p = q.get("p");
  if (!s) {
    if (!SESSIONS.length) SESSIONS = await api("/api/sessions");
    const def = CFG.session || (SESSIONS[0] && SESSIONS[0].name);
    if (def) { location.replace(href(def)); return show(false); }
    await loadSessions(); $("#files").innerHTML = ""; return;
  }
  const changedSession = s !== cur.s;
  cur.s = s; cur.p = p;
  if (changedSession || force || !cur.summary) cur.summary = await api(`/api/session?s=${enc(s)}`);
  await loadSessions();
  fileNav(cur.summary);
  if (!p) { cur.mtime = 0; overview(cur.summary); return; }
  if (p.startsWith("lenses/")) {
    cur.mtime = 0;
    const raw = `/raw?s=${enc(s)}&p=${enc(p)}`;
    $("#main").innerHTML = /\.html?$/.test(p)
      ? `<div class="head"><h2>${esc(p)}</h2><a href="${raw}" target="_blank">open in a new tab</a></div><iframe src="${raw}"></iframe>`
      : `<div class="head"><h2>${esc(p)}</h2></div><div class="doc"><pre id="rawtxt">loading…</pre></div>`;
    if (!/\.html?$/.test(p)) { const r = await fetch(raw); $("#rawtxt").textContent = await r.text(); }
    return;
  }
  const res = await api(`/api/file?s=${enc(s)}&p=${enc(p)}`);
  cur.mtime = res.mtime;
  const ctx = { s, p };
  const y = force ? window.scrollY : 0;
  $("#main").innerHTML = `<div class="head"><span class="path">${esc(s)} / ${esc(p)}</span>
      <span class="tools"><button class="ghost" id="fold1">Collapse all</button><button class="ghost" id="fold0">Expand all</button>
      <button class="ghost" id="fsm" title="smaller text">A−</button><button class="ghost" id="fsp" title="larger text">A+</button>
      <a href="${esc(CFG.vscode + res.abs)}">open in VS Code</a></span></div>
    <div class="reader"><article class="doc" id="doc">${md(res.text, ctx)}</article><aside class="toc" id="toc"></aside></div>`;
  const doc = $("#doc");
  if (p.startsWith("drafts/")) attachMarkers(doc, res);
  if (p.startsWith("learnings/")) attachQuiz(doc, res, ctx);
  if (p === "Lessons.md") attachLessons(doc, cur.summary);
  enhance(doc, p);
  $("#fold1").onclick = () => foldAll(p, true);
  $("#fold0").onclick = () => foldAll(p, false);
  $("#fsm").onclick = () => setFont(-1);
  $("#fsp").onclick = () => setFont(1);
  if (force) window.scrollTo(0, y);
  doc.querySelectorAll("[data-key]").forEach(t => t.addEventListener("input", () => { typed[t.dataset.key] = t.value; }));
}

async function poll() {
  try {
    if (cur.s && cur.p && cur.mtime && !cur.p.startsWith("lenses/")) {
      const r = await api(`/api/mtime?s=${enc(cur.s)}&p=${enc(cur.p)}`);
      if (r.mtime !== cur.mtime) await show(true);
    }
  } catch (e) { /* server restarting; try again next tick */ }
}

(async () => {
  Object.assign(CFG, await api("/api/config"));
  setFont(0);
  setTheme(null);
  $("#theme").onclick = () => setTheme({ auto: "light", light: "dark", dark: "auto" }[$("#theme").textContent]);
  window.addEventListener("hashchange", () => show(false).catch(e => { $("#main").innerHTML = `<p class="err">${esc(e.message)}</p>`; }));
  await show(false);
  setInterval(poll, 2000);
  setInterval(() => { if (cur.s && !cur.p) show(true); }, 15000);
})();
</script>
